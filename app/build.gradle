plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.altitudewidget'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.altitudewidget"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "0.2"
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
